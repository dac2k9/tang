name: CI

on:
  push:
    # (And the branch of steps 108 to 116 while it has no pull request: it is on a fork whose main has no workflow, so a run cannot be started by hand, and the push is what builds the Windows file of the plugin to be tried. Take it out before the pull request.)
    branches: [main, feat/module-collapse]
  pull_request:
    branches: [main]
  # A run that is started by hand (the Actions tab, or `gh workflow run ci.yml --ref BRANCH`): for a branch that is on a fork and has no pull request yet, which is how the Windows file of the plugin (step 113) is built to be tried.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
            apt: "liblilv-dev libasound2-dev libjack-dev"
            brew: ""
          - os: macos-latest
            features: ""
            apt: ""
            brew: "lilv"
          - os: windows-latest
            features: "--no-default-features --features vst3"
            apt: ""
            brew: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install apt packages
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Install brew packages
        if: matrix.brew != ''
        run: brew install ${{ matrix.brew }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # - name: Check formatting
      #   run: cargo fmt --check

      - name: Clippy
        run: cargo clippy ${{ matrix.features }} -- -D warnings

      - name: Test
        run: cargo test ${{ matrix.features }}

      # The web runtime (the `web` feature, docs/web-ui.md): clippy over the tests too,
      # and the tests, among them tests/serve.rs, which runs the real binary on
      # `--audio-device none` (no sound card or MIDI port is needed or opened).
      - name: Clippy (web)
        run: cargo clippy ${{ matrix.features }} --features web --all-targets -- -D warnings

      - name: Test (web)
        run: cargo test ${{ matrix.features }} --features web

  # The kernel of the patch graph (kernel/, docs/patch-graph.md section 11) has no plugin
  # format, sound card or interface in it, so it builds and tests alone, on the three
  # platforms, in debug and in release (its tests hold the executor to a reference
  # interpreter bit for bit, and count the allocator's calls).
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p kernel --all-targets -- -D warnings

      - name: Test
        run: cargo test -p kernel

      - name: Test (release)
        run: cargo test -p kernel --release

  # Tang as a CLAP plugin (tang-clap/, docs/reference/plugin-host.md, step 113): clippy and the tests on the three platforms, and Tang.clap, the file that a DAW loads, built in release with the page in it
  # and kept as an artifact (`Tang-clap-Windows` is the one for Bitwig on Windows). The plugin formats that can be loaded inside it are VST3 only: LV2 needs a library that Windows has not.
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install apt packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev

      # The page is what a release build embeds in the plugin (rust-embed reads web/dist when it compiles).
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the page
        working-directory: web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p tang-clap --all-targets -- -D warnings

      - name: Test
        run: cargo test -p tang-clap

      - name: Build (release)
        run: cargo build --release -p tang-clap

      - name: Make Tang.clap
        if: runner.os != 'Windows'
        run: tang-clap/bundle.sh release dist

      - name: Make Tang.clap
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tang_clap.dll dist/Tang.clap

      - uses: actions/upload-artifact@v4
        with:
          name: Tang-clap-${{ runner.os }}
          path: dist
          retention-days: 30

  # The TypeScript in web/src/protocol/generated/ is generated from the protocol
  # types (docs/web-ui.md section 7) and committed. This fails when what is
  # committed is not what the types generate now; the failure says how to
  # rewrite it. It builds without the plugin formats: it needs none of them.
  typescript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install apt packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The generated TypeScript is up to date
        run: cargo test --no-default-features --features web typescript

  # The browser front-end (web/, docs/web-ui.md): lint, types, unit tests and the production
  # build. Its dependencies are in web/package-lock.json, so `npm ci` installs exactly those.
  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # The browser tests drive a real browser against the real program on the null audio
      # backend (no sound card or MIDI port is used): the page through Vite, and `tang serve`
      # behind it. The debug build of tang, without the plugin formats the tests do not need.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install apt packages
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev

      - name: Build tang
        working-directory: .
        run: cargo build --no-default-features --features web

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
